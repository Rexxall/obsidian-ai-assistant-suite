<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">AI Assistant Suite</title>
  <desc id="d">Turn a messy note into a tidy one. The AI suggests a title, tags, a folder and cleaner text; you untick what you do not want and apply the rest. A review list for “team sync notes.md” has the title, tags and tidied text ticked, the folder move unticked, and an Apply 3 button.</desc>
  <rect width="1200" height="400" rx="28" fill="#15141B"/>
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif">
    <text x="64" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2" fill="#A48BFF">OBSIDIAN PLUGIN · NOTHING CHANGES UNTIL YOU APPLY</text>
    <text x="62" y="194" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#EEECF5">AI Assistant Suite</text>
    <text x="64" y="250" font-size="29" fill="#EEECF5">Messy note in, tidy note out.</text>
    <text x="64" y="290" font-size="29" fill="#9C98AF">You tick what gets written.</text>
    <text x="64" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#9C98AF">free · your key or a local model · undo any time</text>
  </g>
  <g id="project-proof" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif">
    <rect x="700" y="40" width="440" height="320" rx="20" fill="#1E1D26" stroke="#2C2A36"/>
    <text x="724" y="80" font-size="20" font-weight="700" fill="#EEECF5">Review AI suggestions</text>
    <text x="724" y="104" font-size="15" fill="#9C98AF">team sync notes.md</text>
    <circle cx="738" cy="139" r="11" fill="#A48BFF"/>
    <path d="M733 139 l3.5 3.5 l6.5 -7" fill="none" stroke="#15141B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="762" y="135" font-size="17" font-weight="600" fill="#EEECF5">Title</text>
    <text x="762" y="155" font-size="14" fill="#9C98AF">Team sync: launch moves to the 28th</text>
    <rect x="1071.5" y="127" width="44.5" height="24" rx="12" fill="#2C2643"/>
    <text x="1093.75" y="144" font-size="14" text-anchor="middle" fill="#A48BFF">New</text>
    <path d="M724 162 H1116" stroke="#2C2A36"/>
    <circle cx="738" cy="187" r="11" fill="#A48BFF"/>
    <path d="M733 187 l3.5 3.5 l6.5 -7" fill="none" stroke="#15141B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="762" y="183" font-size="17" font-weight="600" fill="#EEECF5">Tags</text>
    <text x="762" y="203" font-size="14" fill="#9C98AF">#meeting  #launch  #todo</text>
    <rect x="1052.5" y="175" width="63.5" height="24" rx="12" fill="#2C2643"/>
    <text x="1084.25" y="192" font-size="14" text-anchor="middle" fill="#A48BFF">New 3</text>
    <path d="M724 210 H1116" stroke="#2C2A36"/>
    <circle cx="738" cy="235" r="11" fill="#A48BFF"/>
    <path d="M733 235 l3.5 3.5 l6.5 -7" fill="none" stroke="#15141B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="762" y="231" font-size="17" font-weight="600" fill="#EEECF5">Text</text>
    <text x="762" y="251" font-size="14" fill="#9C98AF">Decisions, to-dos, next sync</text>
    <rect x="1043.0" y="223" width="73.0" height="24" rx="12" fill="#16301F"/>
    <text x="1079.5" y="240" font-size="14" text-anchor="middle" fill="#5CC892">Change</text>
    <path d="M724 258 H1116" stroke="#2C2A36"/>
    <circle cx="738" cy="283" r="10" fill="none" stroke="#9C98AF" stroke-width="2"/>
    <text x="762" y="279" font-size="17" font-weight="600" fill="#9C98AF">Move to folder</text>
    <text x="762" y="299" font-size="14" fill="#9C98AF">→ Meetings</text>
    <rect x="1062.0" y="271" width="54.0" height="24" rx="12" fill="#15141B"/>
    <text x="1089.0" y="288" font-size="14" text-anchor="middle" fill="#9C98AF">Move</text>
    <rect x="1011.5" y="318" width="104.5" height="30" rx="15" fill="#A48BFF"/>
    <text x="1063.75" y="338" font-size="15" font-weight="600" text-anchor="middle" fill="#15141B">Apply 3</text>
  </g>
</svg>
